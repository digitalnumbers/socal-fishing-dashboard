<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SoCal Fishing Intelligence — San Diego Predictive Fishing Dashboard</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#07131c; --bg-2:#0c1e2b; --surface:#0f2534; --surface-2:#143142; --line:#1e4256;
  --line-soft:#193647; --text:#e9f3f8; --text-2:#a8c2d0; --text-3:#6f8fa1;
  --teal:#2ec4b6; --teal-dim:#1b7d75; --amber:#f4a259; --coral:#ef6461; --sky:#5bc0eb;
  --violet:#9d7fea; --good:#41d69b; --warn:#f4c95d; --bad:#e8695f;
  --r:12px; --r-sm:8px; --mono:'JetBrains Mono',ui-monospace,monospace;
  --sans:'Inter',system-ui,-apple-system,sans-serif;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.55);
}
html[data-theme="light"]{
  --bg:#f4f7f9; --bg-2:#eaf0f4; --surface:#ffffff; --surface-2:#f2f6f9; --line:#d3e0e8;
  --line-soft:#e2ebf0; --text:#0b1f2c; --text-2:#41606f; --text-3:#557383;
  --teal:#12857c; --teal-dim:#9fd8d2; --amber:#c26d1b; --coral:#c94a47; --sky:#1f83b8;
  --violet:#6f52c9; --good:#0f8f61; --warn:#a97a10; --bad:#c0392b;
  --shadow:0 1px 2px rgba(15,40,55,.08),0 10px 26px -16px rgba(15,40,55,.28);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.num,.mono,table td,table th{font-variant-numeric:tabular-nums}
a{color:var(--teal)}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
.wrap{max-width:1380px;margin:0 auto;padding:0 22px}

/* header */
header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line-soft)}
.hd{display:flex;align-items:center;gap:16px;padding:13px 0}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand svg{flex:none;color:var(--teal)}
.brand .t{font-size:15px;font-weight:650;letter-spacing:-.015em;white-space:nowrap}
.brand .s{font-size:11px;color:var(--text-3);white-space:nowrap;letter-spacing:.02em}
.hd-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border:1px solid var(--line);
  border-radius:999px;background:var(--surface);font-size:11.5px;color:var(--text-2);white-space:nowrap}
.badge b{color:var(--text);font-weight:600}
.badge.status-warn{border-color:color-mix(in srgb,var(--warn) 55%,var(--line));color:var(--warn)}
.badge.status-bad{border-color:color-mix(in srgb,var(--bad) 55%,var(--line));color:var(--bad)}
.badge.next-refresh .dot{background:var(--sky)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--teal);flex:none}
.iconbtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);
  color:var(--text-2);cursor:pointer;display:grid;place-items:center;font-size:13px}
.iconbtn:hover{color:var(--text);border-color:var(--teal-dim)}

/* nav */
nav.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line-soft);
  background:var(--bg);position:sticky;top:57px;z-index:35;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:none;border-bottom:2px solid transparent;color:var(--text-3);
  font:inherit;font-size:13px;font-weight:500;padding:11px 14px;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{color:var(--text-2)}
nav.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--teal)}

/* controls */
.controls{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;padding:16px 0 6px}
.ctl{display:flex;flex-direction:column;gap:5px}
.ctl label{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3);font-weight:600}
select,input[type=search]{background:var(--surface);color:var(--text);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:7px 10px;font:inherit;font-size:13px;min-width:170px}
select:focus,input:focus{outline:2px solid var(--teal-dim);outline-offset:1px}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.seg button{background:none;border:none;color:var(--text-3);font:inherit;font-size:12.5px;padding:7px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--text);font-weight:600}
.seg button+button{border-left:1px solid var(--line-soft)}

/* layout */
section.tab{display:none;padding:14px 0 46px}
section.tab.on{display:block}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:1080px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g2{grid-template-columns:1fr}}
@media(max-width:620px){.g4{grid-template-columns:1fr}}
@media(max-width:760px){
  .hd{flex-wrap:wrap;gap:9px}
  .hd-right{margin-left:0;width:100%;gap:7px}
  .badge{font-size:10.5px;padding:4px 9px}
  .brand .t{font-size:14px}
  .srcgrid{grid-template-columns:1fr;padding:12px}
  input.srch{min-width:0;width:100%}
  .card-hd{flex-wrap:wrap;gap:8px}
}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:16px;
  box-shadow:var(--shadow);min-width:0}
.card.pad0{padding:0;overflow:hidden}
.card h3{font-size:13px;letter-spacing:-.005em}
.card .sub{font-size:11.5px;color:var(--text-3);margin-top:3px}
.card-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.kpi .lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3);font-weight:600}
.kpi .val{font-size:27px;font-weight:650;letter-spacing:-.025em;margin-top:7px;line-height:1.1}
.kpi .val small{font-size:14px;font-weight:500;color:var(--text-2);letter-spacing:0}
.kpi .meta{font-size:11.5px;color:var(--text-2);margin-top:6px;line-height:1.45}
.delta{font-family:var(--mono);font-size:11.5px;font-weight:600;padding:2px 6px;border-radius:5px;
  background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.delta.neg{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.delta.flat{background:color-mix(in srgb,var(--text-3) 18%,transparent);color:var(--text-2)}
.chart{position:relative;height:260px}
.chart.tall{height:330px}
.chart.short{height:190px}

/* table */
.tbl-wrap{overflow-x:auto}
.tbl-wrap.scroll-tall{max-height:560px;overflow-y:auto}
.tbl-wrap.scroll-tall thead th{position:sticky;top:0;z-index:2;background:var(--surface-2)}
input.srch{background:var(--surface-2);border:1px solid var(--line);color:var(--text);
  border-radius:var(--r-sm);padding:7px 11px;font:inherit;font-size:12.5px;min-width:250px}
input.srch:focus{outline:none;border-color:var(--teal)}
input.srch::placeholder{color:var(--text-3)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:right;padding:7px 9px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
/* forecast accuracy: text-heavy tables wrap and read left-aligned */
table.wraptxt td,table.wraptxt th{white-space:normal;text-align:left;vertical-align:top}
table td.tl,table th.tl{text-align:left}
/* model registry list (Forecast Accuracy) */
.reg{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.reg:last-of-type{border-bottom:0}
.reg .rn{font-weight:650;overflow-wrap:anywhere;min-width:0}
.reg .rs{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:flex-start}
.reg .rd{grid-column:1/-1;font-size:12px;color:var(--text-2);line-height:1.45}
.reg ul{margin:4px 0 0 16px;padding:0;font-size:11.5px;color:var(--text-3);line-height:1.45}
.seg.sm button{font-size:11.5px;padding:4px 10px}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);font-weight:600;
  position:sticky;top:0;background:var(--surface);z-index:1}
th:first-child,td:first-child{text-align:left}
tbody tr:hover{background:var(--surface-2)}
td.wrap-ok{white-space:normal;min-width:220px;line-height:1.4}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:600;
  border:1px solid var(--line);color:var(--text-2)}
.pill.mx{border-color:color-mix(in srgb,var(--amber) 45%,transparent);color:var(--amber)}

/* heatmap */
.hm{overflow-x:auto}
.hm table{border-collapse:separate;border-spacing:2px;font-size:12px}
.hm th{background:transparent;position:static;text-transform:none;font-size:11px;letter-spacing:0}
.hm th.zh{writing-mode:horizontal-tb;font-size:10.5px;color:var(--text-2);text-align:center;
  max-width:88px;white-space:normal;line-height:1.25;vertical-align:bottom;padding-bottom:6px}
.hm td{border:none;padding:0;text-align:center}
.hm td.sp{text-align:left;padding-right:10px;color:var(--text-2);font-size:12px;white-space:nowrap}
.cell{height:30px;min-width:58px;border-radius:6px;display:grid;place-items:center;font-family:var(--mono);
  font-size:11.5px;font-weight:600;cursor:pointer;border:1px solid transparent;color:#04121a}
.cell:hover{border-color:var(--text)}
.cell.na{background:var(--bg-2);color:var(--text-3);cursor:default;font-weight:400}
.legend{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-3);margin-top:10px;flex-wrap:wrap}
.legend .bar{height:9px;width:150px;border-radius:5px;
  background:linear-gradient(90deg,#25505f,#2e7a86,#37a68e,#8fd36a,#f6d746,#f0913c,#e85b4d)}

/* misc */
.note{font-size:11.5px;color:var(--text-3);line-height:1.55}
.driver{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.driver .dn{width:96px;font-size:11.5px;color:var(--text-2);flex:none}
.driver .db{flex:1;height:9px;background:var(--bg-2);border-radius:5px;overflow:hidden;position:relative}
.driver .db i{position:absolute;top:0;bottom:0;left:50%;border-radius:5px}
.driver .dv{width:52px;text-align:right;font-family:var(--mono);font-size:11.5px;color:var(--text-2);flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--surface-2);
  border:1px solid var(--line-soft);color:var(--text-2)}
.status-summary{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 12px}
.status-count{font:600 12px/1 var(--mono);padding:6px 9px;border-radius:6px;border:1px solid var(--line)}
.status-count.fresh,.status-count.not_due{color:var(--good)}
.status-count.delayed,.status-count.cached{color:var(--warn)}
.status-count.stale,.status-count.failed{color:var(--bad)}
.status-note{max-width:420px;white-space:normal}
/* methodology block */
.meth{padding:2px 16px 4px}
.meth ol{margin:0;padding-left:20px;font-size:12.5px;line-height:1.75;color:var(--text-2)}
.meth li{margin-bottom:9px;padding-left:2px}
.meth li::marker{color:var(--teal);font-weight:600}
.meth b{color:var(--text);font-weight:600}
.meth code{font-family:var(--mono);font-size:11px;background:var(--surface-2);border:1px solid var(--line-soft);
  border-radius:4px;padding:1px 5px;color:var(--text);white-space:nowrap}
.meth sup{font-size:8.5px}
.meth p.note{margin:12px 0 0;font-size:12px;line-height:1.65;border-top:1px solid var(--line-soft);padding-top:11px}
/* source registry cards */
.srcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;padding:14px}
.src{border:1px solid var(--line-soft);border-radius:var(--r-sm);padding:13px 14px;background:var(--surface-2)}
.src-t{font-size:13.5px;font-weight:600;color:var(--text);text-decoration:none;line-height:1.35;display:block}
.src-t:hover{color:var(--teal)}
.src-p{font-size:11px;color:var(--teal);margin-top:3px;letter-spacing:.02em}
.src-u{font-size:12px;color:var(--text-2);line-height:1.55;margin-top:9px}
.src-dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:11px 0 0;font-size:11.5px}
.src-dl dt{color:var(--text-3);text-transform:uppercase;font-size:9.5px;letter-spacing:.06em;padding-top:2px}
.src-dl dd{margin:0;color:var(--text-2)}
.src-lim{font-size:11.5px;color:var(--text-3);line-height:1.55;margin-top:11px;
  border-top:1px solid var(--line-soft);padding-top:9px}
.src-lim b{color:var(--warn);font-weight:600;text-transform:uppercase;font-size:9.5px;letter-spacing:.06em}
.src-ep{display:block;margin-top:9px;font-family:var(--mono);font-size:9.5px;color:var(--text-3);
  word-break:break-all;line-height:1.5;opacity:.8}
a.chip.lnk{text-decoration:none;font-family:var(--mono);font-size:10.5px}
a.chip.lnk:hover{border-color:var(--teal);color:var(--teal)}
.chips + .sub{padding:0 14px}
.dl{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface-2);color:var(--text);text-decoration:none;font-size:13px;font-weight:500}
.dl:hover{border-color:var(--teal);color:var(--teal)}
footer{border-top:1px solid var(--line-soft);padding:22px 0 40px;color:var(--text-3);font-size:11.5px;line-height:1.6}
.callout{border:1px solid var(--line);border-left:3px solid var(--amber);background:var(--surface-2);
  border-radius:var(--r-sm);padding:12px 14px;font-size:12.5px;color:var(--text-2);line-height:1.55}
.rank{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;
  border-bottom:1px solid var(--line-soft);font-size:12.5px}
.rank:last-child{border-bottom:none}
.rank .l{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .r{font-family:var(--mono);font-weight:600;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- extended outlook: confidence tiers ---------- */
:root{--t1:#41d69b; --t2:#f4c95d; --t3:#9d7fea}
html[data-theme="light"]{--t1:#0f8f61; --t2:#a97a10; --t3:#6f52c9}
.cbadge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;
  font-size:11px;font-weight:600;letter-spacing:.01em;white-space:nowrap;
  border:1px solid currentColor;background:color-mix(in srgb,currentColor 12%,transparent)}
.cbadge .cd{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.cbadge.t1{color:var(--t1)} .cbadge.t2{color:var(--t2)} .cbadge.t3{color:var(--t3)}
.tierleg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:900px){.tierleg{grid-template-columns:1fr}}
.tiercard{border:1px solid var(--line-soft);border-left:3px solid currentColor;border-radius:var(--r-sm);
  padding:13px 14px;background:var(--surface-2)}
.tiercard.t1{color:var(--t1)} .tiercard.t2{color:var(--t2)} .tiercard.t3{color:var(--t3)}
.tiercard .th{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.tiercard .tt{font-size:13px;font-weight:650}
.tiercard .tr{font-family:var(--mono);font-size:11px;opacity:.85;flex:none}
.tiercard .tb{font-size:11.5px;color:var(--text-2);line-height:1.55;margin-top:8px}
.tiercard .ts{font-size:11.5px;color:var(--text-3);line-height:1.55;margin-top:8px;
  border-top:1px solid var(--line-soft);padding-top:8px}
.tiercard .ts b{color:var(--text-2);font-weight:600}
/* tier stripe under the outlook chart */
.stripe{display:flex;height:7px;border-radius:4px;overflow:hidden;margin-top:10px;gap:2px}
.stripe i{display:block;height:100%;border-radius:3px}
.stripe i.t1{background:var(--t1)} .stripe i.t2{background:var(--t2)} .stripe i.t3{background:var(--t3)}
.striplab{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-3);margin-top:5px}
/* "not published" cells — no fabricated number at long lead */
td.np,.np{color:var(--text-3);font-style:italic}
.trend{font-family:var(--mono);font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;white-space:nowrap}
.trend.up2{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--good)}
.trend.up1{background:color-mix(in srgb,var(--good) 12%,transparent);color:var(--good)}
.trend.flat{background:color-mix(in srgb,var(--text-3) 16%,transparent);color:var(--text-2)}
.trend.dn1{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.trend.dn2{background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad)}
/* provenance basis tags */
.basis{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:2px 7px;border-radius:5px;white-space:nowrap;border:1px solid currentColor;
  background:color-mix(in srgb,currentColor 12%,transparent)}
.basis.forecast{color:var(--sky)} .basis.climatology{color:var(--amber)}
.basis.astronomical{color:var(--teal)} .basis.enso_analog{color:var(--violet)}
.basis.blend{color:var(--warn)} .basis.metadata{color:var(--text-3)}
.sv{display:inline-block;min-width:38px;padding:2px 7px;border-radius:6px;border:1px solid transparent;
  font-weight:650;font-variant-numeric:tabular-nums;color:var(--text);text-align:center}
@media(max-width:620px){.meth code{white-space:normal;overflow-wrap:anywhere}.reg{grid-template-columns:1fr}.reg .rs{justify-content:flex-start}}
</style>
</head>
<body>
<header>
  <div class="wrap hd">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-label="SoCal Fishing Intelligence logo">
        <circle cx="16" cy="16" r="15" stroke="currentColor" stroke-width="1.4" opacity=".35"/>
        <path d="M3 20c3.2-2.6 5.6-2.6 8.8 0s5.6 2.6 8.8 0 5.6-2.6 8.8 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M9 12.5c3.4-4.6 9.6-4.6 13 0-3.4 4.6-9.6 4.6-13 0z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <circle cx="19.2" cy="11.4" r="1.15" fill="currentColor"/>
      </svg>
      <div>
        <div class="t">SoCal Fishing Intelligence</div>
        <div class="s" id="hd-sub">San Diego · inshore → offshore</div>
      </div>
    </div>
    <div class="hd-right">
      <span class="badge" id="badge-enso"><span class="dot"></span><span></span></span>
      <span class="badge" id="badge-sources" aria-label="Source freshness"></span>
      <span class="badge" id="badge-run"></span>
      <span class="badge next-refresh" id="badge-next" aria-label="Next scheduled refresh"></span>
      <button class="iconbtn" id="theme" title="Toggle light / dark" aria-label="Toggle theme">◐</button>
    </div>
  </div>
  <nav class="tabs wrap" role="tablist">
    <button role="tab" aria-selected="true" data-tab="today">Today</button>
    <button role="tab" aria-selected="false" data-tab="forecast">7-Day Forecast</button>
    <button role="tab" aria-selected="false" data-tab="outlook">30-Day Outlook</button>
    <button role="tab" aria-selected="false" data-tab="conditions">Conditions vs Normal</button>
    <button role="tab" aria-selected="false" data-tab="species">Species Model</button>
    <button role="tab" aria-selected="false" data-tab="enso">ENSO Regime</button>
    <button role="tab" aria-selected="false" data-tab="validation">Validation</button>
    <button role="tab" aria-selected="false" data-tab="accuracy">Forecast Accuracy</button>
    <button role="tab" aria-selected="false" data-tab="data">Data &amp; Sources</button>
  </nav>
</header>
