name: Daily dashboard refresh

on:
  schedule:
    # Hourly candidates provide same-day retries. The gate rejects times before
    # 08:15 Pacific and exits cheaply after the first successful local-day run.
    - cron: "30 15-23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate a staged copy without network, commit, or deploy
        type: boolean
        default: false
      force:
        description: Ignore same-Pacific-day success state
        type: boolean
        default: false
      full_rebuild:
        description: Force periodic checks and recompute derived history
        type: boolean
        default: false

concurrency:
  group: socal-fishing-daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      should_deploy: ${{ steps.result.outputs.should_deploy }}
    env:
      TZ: America/Los_Angeles
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Check Pacific schedule window
        id: gate
        run: python pipeline/schedule_gate.py --event "$GITHUB_EVENT_NAME"

      - name: Determine run mode
        id: mode
        env:
          GATE_ALLOWED: ${{ steps.gate.outputs.allowed }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          if [[ "$GATE_ALLOWED" != "true" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            [[ "$DRY_RUN" == "true" ]] && echo "should_deploy=false" >> "$GITHUB_OUTPUT" || echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pinned dependencies
        if: steps.mode.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run tests
        if: steps.mode.outputs.run == 'true'
        run: python -m unittest discover -s tests -v

      - name: Refresh, rebuild, and validate
        if: steps.mode.outputs.run == 'true'
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run || 'false' }}
          INPUT_FORCE: ${{ inputs.force || 'false' }}
          INPUT_FULL_REBUILD: ${{ inputs.full_rebuild || 'false' }}
        run: |
          args=()
          [[ "$INPUT_DRY_RUN" == "true" ]] && args+=(--dry-run)
          [[ "$INPUT_FORCE" == "true" ]] && args+=(--force)
          [[ "$INPUT_FULL_REBUILD" == "true" ]] && args+=(--full-rebuild)
          python pipeline/run_daily_refresh.py "${args[@]}"

      - name: Determine validated deployment result
        id: result
        if: always()
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          should_deploy=false
          if [[ "${{ steps.mode.outputs.run }}" == "true" && "$INPUT_DRY_RUN" != "true" && -f build-report.json ]]; then
            should_deploy="$(python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("build-report.json").read_text())
          print(str(bool(
              report.get("ok")
              and report.get("promoted")
              and not report.get("skipped")
          )).lower())
          PY
          )"
          fi
          echo "should_deploy=$should_deploy" >> "$GITHUB_OUTPUT"

      - name: Commit validated generated state
        if: steps.result.outputs.should_deploy == 'true'
        env:
          LOCAL_DATE: ${{ steps.gate.outputs.local_date }}
        run: |
          git config user.name "socal-fishing-refresh[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Persist canonical/LKG state and the deployable payload. The workbook
          # and app/downloads mirrors are rebuilt and deployed but deliberately
          # not committed each day, avoiding duplicate binary Git history.
          git add -A -- dataset/csv app/data.js docs .refresh-cache build-report.json data
          if git diff --cached --quiet; then
            echo "No meaningful generated changes."
          else
            git commit -m "chore(data): daily refresh ${LOCAL_DATE} PT"
            git push
          fi

      - name: Upload validated Pages bundle
        if: steps.result.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: app

      - name: Write run summary
        if: always()
        run: |
          {
            echo "## SoCal Fishing daily refresh"
            echo
            echo "- Pacific schedule gate: \`${{ steps.gate.outputs.allowed || 'not evaluated' }}\`"
            echo "- Local build date: \`${{ steps.gate.outputs.local_date || 'n/a' }}\`"
            echo "- Validated deployment: \`${{ steps.result.outputs.should_deploy || 'false' }}\`"
            if [[ -f build-report.json ]]; then
              echo
              echo '```json'
              cat build-report.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload safe diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: refresh-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build-report.json
            dataset/csv/source_status.json

  deploy:
    needs: refresh
    if: needs.refresh.result == 'success' && needs.refresh.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy validated site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
